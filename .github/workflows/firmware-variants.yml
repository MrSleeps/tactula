name: Firmware variant builds

concurrency:
  group: firmware-variants-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - feature/upstream-1.3-performance-office-plan
  workflow_dispatch:

jobs:
  release-tooling-tests:
    name: Release packaging tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release packaging logic
        run: python -m unittest discover -s tests -p 'test_release_packager.py' -v

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [without_bambu, with_bambu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e ${{ matrix.variant }}
      - name: Show firmware size
        run: ls -lh .pio/build/${{ matrix.variant }}/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: tactula-${{ matrix.variant }}
          path: .pio/build/${{ matrix.variant }}/firmware.bin
          if-no-files-found: error

  office-bambu-upstream:
    name: Office Bambu (upstream v1.3.0)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official TouchDeck v1.3.0
        uses: actions/checkout@v4
        with:
          repository: Keralots/TouchDeck
          ref: v1.3.0
          path: office-upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build the Guition printer-capable firmware
        working-directory: office-upstream
        run: pio run -e jc3248w535
      - name: Inspect office firmware
        run: ls -lh office-upstream/.pio/build/jc3248w535/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: touchdeck-office-bambu-upstream-v1.3.0
          path: office-upstream/.pio/build/jc3248w535/firmware.bin
          if-no-files-found: error
