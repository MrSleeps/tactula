<div class="grid-2">
  <div class="field">
    <label class="field-label" for="wifiSsid">Network name</label>
    <input type="text" id="wifiSsid" name="ssid" maxlength="32" autocomplete="off">
  </div>
  <div class="field">
    <label class="field-label" for="wifiPass">Password</label>
    <input type="password" id="wifiPass" name="pass" maxlength="64" autocomplete="new-password" placeholder="Unchanged if left empty">
  </div>
</div>
