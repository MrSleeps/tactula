; TouchDeck - Home Assistant touch deck on the Guition JC3248W535
;
; 3.5" 320x480 IPS (AXS15231B over QSPI) + capacitive touch, ESP32-S3-N16R8
; (16MB flash / 8MB PSRAM). The panel is driven by src/deck_panel.cpp
; (spi_master QSPI, async DMA through internal bounce buffers, software
; rotation, TE-synced full frames) and every screen is composed by LVGL
; (src/deck_ui.cpp). Home Assistant entities and media controls use the HA API.
;
; Build with `pio run`. Never run two builds in parallel (.sconsign race).

[platformio]
default_envs = without_bambu
; Own package folder: the pioarduino framework has the same package name as
; the espressif32 6.x one, and a 6.x project build replaces it in ~/.platformio.
core_dir = ~/.platformio-pioarduino

[env]
; Toolchain pinned to an exact pioarduino release (Arduino 3.x / IDF 5.x): the
; task watchdog in main.cpp uses the IDF 5 config-struct API.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Portal files in web/ are gzipped into src/web_assets.h before each build.
extra_scripts = pre:scripts/web_embed.py
board_build.partitions = partitions_16mb.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps =
    bblanchon/ArduinoJson@^7.0
    knolleary/PubSubClient@2.8
    ; Only for the AXS15231B init command table (deck_panel.cpp). 1.6.x is
    ; required by the Arduino 3.x core; exact pin, a minor bump has no upside.
    moononournation/GFX Library for Arduino@1.6.7
    ; Exact pin: the deck pipeline was measured against this release
    ; (flush-wait callback, snapshot API).
    lvgl/lvgl@9.5.0
    ; Home Assistant WebSocket client (deck_ha.cpp).
    links2004/WebSockets@2.6.1
build_unflags =
    -Os
build_flags =
    -O2
    -D BOARD_VARIANT=\"jc3248w535\"
    -D BOARD_NAME=\"Guition_JC3248W535\"
    -D BOARD_PANEL=\"AXS15231B_320x480_QSPI\"
    -D BOARD_IS_JC3248W535=1
    -D BOARD_HAS_PSRAM=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Panel, TE and touch pins are constants in src/deck_panel.cpp and
    ; src/deck_touch.cpp.
    -D BACKLIGHT_PIN=1
    ; --- LVGL: configuration in include/lv_conf.h ---
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    ; Arduino's panic hook (set_arduino_panic_handler), used by src/crash_log.cpp.
    -Wl,--wrap=esp_panic_handler
    -Wl,--wrap=log_printf


; Device variants share the same hardware and common firmware.
; The two firmware variants share the same firmware but the without_bambu build
; excludes the Bambu backend and UI entirely at compile time.
[env:without_bambu]
build_src_filter =
    +<*>
    -<p4_*.cpp>
    -<deck_bambu.cpp>
    -<deck_bambu_ha.cpp>
    -<deck_hms.cpp>
    -<deck_office_bambu.cpp>
    -<deck_ui_bambu.cpp>
build_flags =
    ${env.build_flags}
    -D TOUCHDECK_FEATURE_BAMBU=0

[env:with_bambu]
build_src_filter =
    +<*>
    -<p4_*.cpp>
build_flags =
    ${env.build_flags}
    -D TOUCHDECK_FEATURE_BAMBU=1


; ---------------------------------------------------------------------------
; JC8012P4A1C: experimental ESP32-P4 hardware bring-up
; This is a serial/PSRAM diagnostic ONLY, not yet a Tactula dashboard build.
; Keep it isolated from the S3 panel/compositor and Wi-Fi code until the
; JD9365 MIPI-DSI, GSL3680 touch and ESP32-C6 host drivers are integrated.
; Do not add this environment to default_envs or the release builder.
; ---------------------------------------------------------------------------
[env:jc8012p4a1c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-p4_r3-evboard
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
build_src_filter =
    -<*>
    +<p4_display_test.cpp>
    +<p4_board.cpp>
    +<deck_lv_mem.cpp>
extra_scripts =
    pre:scripts/p4_fix_jd9365.py
lib_deps =
    lvgl/lvgl@9.5.0
    https://github.com/chipguyhere/JC8012P4A1C_display.git
    https://github.com/chipguyhere/JC8012P4A1C_board.git
build_unflags =
build_flags =
    -D ARDUINO_ESP32P4_DEV=1
    -D BOARD_HAS_PSRAM=1
    -D BOARD_IS_JC8012P4A1C=1
    -D P4_PPA_SINGLE_BUFFER_TEST=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

; One-time, opt-in GSL3680 firmware installer. Download the GPL-2.0
; vendor header locally with scripts/prepare_p4_touch_install.ps1 before
; building. It is stored under .pio/ and never committed to this project.
; This target is NOT a normal firmware/release variant.
[env:jc8012p4a1c_touch_install]
extends = env:jc8012p4a1c
build_flags =
    ${env:jc8012p4a1c.build_flags}
    -D P4_TOUCH_NVS_INSTALL=1
    -I .pio/p4-touch-installer

; Experimental hosted-C6 networking + Tactula first-run Wi-Fi QR/portal.
; Separate build from known-good display/touch test for safe rollback.
; This does not install or update the ESP32-C6 radio firmware.
[env:jc8012p4a1c_wifi]
extends = env:jc8012p4a1c
extra_scripts =
    pre:scripts/p4_fix_jd9365.py
    pre:scripts/web_embed.py
build_src_filter =
    -<*>
    +<p4_display_test.cpp>
    +<p4_board.cpp>
    +<deck_lv_mem.cpp>
    +<p4_wifi_setup.cpp>
    +<deck_fonts/deck_font_14.c>
    +<deck_fonts/deck_font_20.c>
    +<deck_fonts/deck_font_28.c>
build_flags =
    ${env:jc8012p4a1c.build_flags}
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D P4_WIFI_SETUP_TEST=1

; MAINTENANCE ONLY: Serial/SDIO ESP-Hosted OTA to ESP32-C6 coprocessor.
; NEVER bundled into routine Tactula firmware or release builds.
; Does not initialise the LCD, change P4 NVS or rewrite P4 partitions.
; The companion Python utility sources the 2.12.3 C6 image from the
; installed pinned pioarduino framework package on the developer's PC.
[env:jc8012p4a1c_c6_ota]
extends = env:jc8012p4a1c
build_src_filter =
    -<*>
    +<p4_c6_ota.cpp>
extra_scripts =
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
build_flags =
    ${env:jc8012p4a1c.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=0
    -D P4_C6_OTA_MAINTENANCE=1

; Shared Tactula dashboard, experimental P4 runtime. Use app-only USB flashing.
[env:jc8012p4a1c_tactula]
extends = env:jc8012p4a1c
custom_p4_usb_cdc = 0
build_src_filter =
    +<*>
    -<p4_*.cpp>
    +<p4_board.cpp>
extra_scripts =
    pre:scripts/p4_fix_jd9365.py
    pre:scripts/web_embed.py
lib_deps =
    ${env:jc8012p4a1c.lib_deps}
    bblanchon/ArduinoJson@^7.0
    knolleary/PubSubClient@2.8
    links2004/WebSockets@2.6.1
build_unflags =
    -D CORE_DEBUG_LEVEL=1
build_flags =
    ${env:jc8012p4a1c.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_VARIANT=\"jc8012p4a1c\"
    -D BOARD_NAME=\"Guition_JC8012P4A1C\"
    -D BOARD_PANEL=\"JD9365_1280x800_MIPI_DSI\"
    -D TACTULA_P4_MANAGED_BACKLIGHT=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D TOUCHDECK_FEATURE_BAMBU=1
    -Wl,--wrap=esp_panic_handler
    -Wl,--wrap=log_printf

; Guition P4 release target. Rebuild the SDK for hosted Wi-Fi and cache-safe scanout.
[env:jc8012p4a1c_bambu]
extends = env:jc8012p4a1c_tactula
; Pin the existing 16 MB dual-OTA scheme (6.25 MB per app, NVS at 0x9000).
; A future generic board definition must not silently switch this to no-OTA.
board_build.partitions = partitions_p4_16mb.csv
extra_scripts =
    ${env:jc8012p4a1c_tactula.extra_scripts}
    pre:scripts/p4_pin_hosted_wifi.py
custom_sdkconfig =
    CONFIG_ESP_HOSTED_SDIO_HOST_INTERFACE=y
    ; The C6 uses slot 1; the SD card uses slot 0.
    CONFIG_ESP_HOSTED_SDIO_SLOT_1=y
    CONFIG_LCD_DSI_ISR_CACHE_SAFE=y
    ; This Kconfig option also selects the DW-GDMA IRAM helper functions
    ; used by Guition's custom DPI driver. Tactula does not start a CSI camera.
    CONFIG_CAM_CTLR_MIPI_CSI_ISR_CACHE_SAFE=y
build_flags =
    ${env:jc8012p4a1c_tactula.build_flags}
    -D TACTULA_P4_CACHE_SAFE_SCANOUT=1

; Compatibility for older PlatformIO commands and build configurations.
[env:jc8012p4a1c_cache_safe]
extends = env:jc8012p4a1c_bambu
